# What README's quick start promises, on every push and pull request: a fresh clone builds (bgfx included, from the
# submodules) and its tests pass.
name: build

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Short work folder (bgfx's third-party paths are deep)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache keys
        id: keys
        shell: bash
        run: echo "bgfx=$(git rev-parse HEAD:external/bgfx HEAD:external/bx HEAD:external/bimg | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # vcpkg: a new key every run, restored from the newest one, so packages built here are saved for the next run
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json') }}-
            vcpkg-

      # bgfx: what the libraries are built from (the submodules' commits, our patches, how we build them). The stamp
      # inside tells cmake/BgfxBuild.cmake they are current, so a hit builds nothing
      - name: bgfx build cache
        uses: actions/cache@v4
        with:
          path: external/bgfx/.build/win64_vs2022/bin
          key: bgfx-windows-${{ steps.keys.outputs.bgfx }}-${{ hashFiles('patches/bgfx/*.patch', 'cmake/BgfxBuild.cmake') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (builds bgfx when it is not cached)
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
          # ports fixed upstream after the manifest's baseline (kubazip 0.3.15: GitHub's archive changed its hash; vcpkg's
          # port-version 1 of 2026-11-21): a machine whose packages are already built never needs them
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/tools/vcpkg-overlay
        run: |
          set VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%
          cmake --preset win64

      - name: Build
        run: cmake --build --preset win64-release

      - name: Tests
        working-directory: build-win64
        run: ctest -j 4 --output-on-failure -E Mcp

  linux:
    # Ubuntu 24.04 with the packages of Dockerfile.linux: the same build a Linux user runs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache keys
        id: keys
        run: echo "bgfx=$(git rev-parse HEAD:external/bgfx HEAD:external/bx HEAD:external/bimg | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: bgfx build cache
        uses: actions/cache@v4
        with:
          path: external/bgfx/.build/linux64_gcc/bin
          key: bgfx-linux-${{ steps.keys.outputs.bgfx }}-${{ hashFiles('patches/bgfx/*.patch', 'cmake/BgfxBuild.cmake') }}

      # The image's layers (apt packages, RmlUi) are cached: they are built again only when Dockerfile.linux changes.
      # Dockerfile.linux copies nothing from the repository, so its context is an empty folder
      - uses: docker/setup-buildx-action@v3

      - name: Empty build context
        run: mkdir -p "$RUNNER_TEMP/empty"

      - name: Build environment (Dockerfile.linux)
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/empty
          file: Dockerfile.linux
          tags: pakal-linux
          load: true
          cache-from: type=gha,scope=pakal-linux
          cache-to: type=gha,scope=pakal-linux,mode=max

      - name: Configure, build and test (builds bgfx when it is not cached)
        run: >
          docker run --rm -v "$PWD:/workspace" -w /workspace pakal-linux bash -c
          "git config --global --add safe.directory '*' &&
          cmake --preset linux-release &&
          cmake --build --preset linux-release -j 4 &&
          cd build-linux && ctest -j 4 --output-on-failure -E Mcp"

      # The core again with ThreadSanitizer: any data race while CoreTests runs (the task queues, the systems' threads,
      # the pool) fails the job. Newer kernels randomize addresses past what TSan maps; 28 bits is what it expects
      - name: Data races (ThreadSanitizer on the core)
        run: >
          sudo sysctl -w vm.mmap_rnd_bits=28 &&
          docker run --rm -v "$PWD:/workspace" -w /workspace -e TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1"
          pakal-linux bash -c
          "git config --global --add safe.directory '*' &&
          cmake --preset linux-tsan &&
          cmake --build --preset linux-tsan -j 4 &&
          cd build-tsan && ctest --output-on-failure"
